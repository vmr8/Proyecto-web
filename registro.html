        <main class="registro">
            <section>
                <h1>Registrate</h1>
            </section>
            <section class="fom-registro">
              <form action="URL_DEL_SERVIDOR" method="POST">
                <div class="campo-formulario-1">
                    <input type="text" id="nombre" placeholder="Nombre" required>
                </div>
                <div class="campo-formulario-1">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="campo-formulario-1">
                    <input type="password" id="contraseña" placeholder="Contraseña" required>
                </div>
                <div class="campo-formulario-1">
                    <input type="password" id="repetir-contraseña" placeholder="Repite la contraseña" required>
                </div>
                <div>
                    <button class="btn-r" type="submit">Registrarse</button>
                </div>
              </form>
            </section>
        </main>
